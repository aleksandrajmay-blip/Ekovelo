<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЭкоВело учет</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--fg:#1f1d1a;--mut:#7a746b;--line:#e3dfd8;--acc:#2f6fed;--accfg:#fff;--danger:#d64545;--hov:#f0ede7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151518;--card:#202025;--fg:#f0ede7;--mut:#9a948a;--line:#33333a;--acc:#5b8cff;--danger:#ff6b6b;--hov:#2a2a31}}
:root[data-theme="dark"]{--bg:#151518;--card:#202025;--fg:#f0ede7;--mut:#9a948a;--line:#33333a;--acc:#5b8cff;--danger:#ff6b6b;--hov:#2a2a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.hin{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:0 0 auto}
#total{color:var(--mut);font-size:14px;flex:1 1 auto;text-align:right;order:3}
.sw{position:relative;flex:1 1 320px;order:2;min-width:0}
#q{width:100%;font:inherit;padding:10px 38px 10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px}
#clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px 10px;color:var(--mut);display:none}
#sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:50vh;overflow:auto;display:none;z-index:40}
.sg{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sg:last-child{border:0}
.sg:hover,.sg.act{background:var(--hov)}
.sg b{font-weight:600}
.sg small{display:block;color:var(--mut)}
.tools{display:flex;gap:8px;order:4}
.signature{font-size:10px;color:var(--mut);white-space:nowrap;align-self:center;letter-spacing:.04em;margin-left:2px}
main{max-width:980px;margin:0 auto;padding:14px 16px 90px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 10px;touch-action:manipulation}
button:hover{background:var(--hov)}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.p:hover{filter:brightness(1.08);background:var(--acc)}
button.d{color:var(--danger)}
button.i{padding:4px 8px;min-width:36px}
button:disabled{opacity:.5;cursor:default}
.node{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.node .node{margin:6px 8px 8px;border-radius:10px}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.nm{flex:1 1 160px;min-width:0}
.name{overflow-wrap:anywhere;font-weight:600}
.item .name{font-weight:500}
.path{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.badge{font-size:13px;color:var(--mut);background:var(--bg);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tg{background:none;border:0;padding:2px 6px;font-size:16px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kids{border-top:1px solid var(--line);padding-bottom:2px}
.qty{display:flex;align-items:center;gap:6px}
.qty b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);text-align:center;padding:40px 16px}
.note{color:var(--mut);font-size:13px;padding:8px 14px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px;color:var(--mut)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.crumbs .sep{color:var(--mut)}.crumbs .cur{overflow-wrap:anywhere}
.go .row{cursor:pointer}.go:hover{border-color:var(--acc)}
.chev{color:var(--mut);font-size:22px;padding:0 4px;line-height:1}
.head{border-color:var(--acc)}
.head .name{font-size:18px}
.single .node{border:2px solid var(--acc)}
.single .row{padding:14px}
.single .name{font-size:20px}
.single .qty b{font-size:22px;min-width:48px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov.on{display:flex}
#dlg{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:380px}
#dlg h2{margin:0 0 12px;font-size:18px;overflow-wrap:anywhere}
#dlg label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#dlg input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
@media (max-width:640px){
  .hin{padding:10px 12px;gap:8px}
  .sw{order:5;flex:1 1 100%}
  #total{text-align:left;order:2}
  h1{flex:1 1 auto;font-size:18px}
  main{padding:10px 8px 90px}
  .acts{width:100%}
  .acts button{flex:1 1 auto}
  .acts button.i{flex:0 0 auto}
  .item .acts{width:auto}
  #sug{max-height:42vh}
}
@media (min-width:900px){
  .item .row{padding:10px 14px}
  .node .node{margin:6px 12px 10px}
}
</style>
</head>
<body>
<header><div class="hin">
  <h1>ЭкоВело учет</h1>
  <div class="sw">
    <input id="q" type="search" placeholder="Поиск товара по словам…" autocomplete="off" enterkeyhint="search" aria-label="Поиск товара">
    <button id="clr" type="button" aria-label="Очистить поиск">×</button>
    <div id="sug" role="listbox"></div>
  </div>
  <span id="total"></span>
  <div class="tools">
    <button id="th" type="button" title="Тема оформления"></button>
    <button class="p" id="addRoot" type="button">+ Категория</button>
    <span class="signature">by MARM</span>
  </div>
</div></header>
<main>
  <div id="msg" class="note"></div>
  <div id="tree"></div>
</main>
<div id="ov"><div id="dlg" role="dialog" aria-modal="true"></div></div>
<script>
var db=null,nodes=[],byId={},open={},loaded=false,col=null;
var focusId=null,showRes=false,actIdx=-1,sugList=[],curId="";
var tree=document.getElementById("tree"),msg=document.getElementById("msg"),ov=document.getElementById("ov"),dlg=document.getElementById("dlg");
var qi=document.getElementById("q"),sug=document.getElementById("sug"),clr=document.getElementById("clr");

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function btn(txt,cls,fn,title){var b=el("button",cls,txt);b.type="button";if(title){b.title=title;b.setAttribute("aria-label",title);}b.onclick=fn;return b;}
function kids(pid){return nodes.filter(function(n){return n.parentId===pid;}).sort(function(a,b){
  if(a.type!==b.type)return a.type==="cat"?-1:1;return a.name.localeCompare(b.name,"ru");});}
function sum(id){var s=0;kids(id).forEach(function(n){s+=n.type==="item"?(n.qty||0):sum(n.id);});return s;}
function allDesc(id){var r=[];kids(id).forEach(function(n){r.push(n);if(n.type==="cat")r=r.concat(allDesc(n.id));});return r;}
function pathOf(n){var p=[],c=byId[n.parentId],g=0;while(c&&g++<50){p.unshift(c.name);c=byId[c.parentId];}return p.join(" › ");}

/* ---------- theme ---------- */
var themes=["auto","light","dark"],tLabel={auto:"🌓 Авто",light:"☀️ Светлая",dark:"🌙 Тёмная"},theme="auto";
try{var sv=localStorage.getItem("theme");if(themes.indexOf(sv)>=0)theme=sv;}catch(e){}
function applyTheme(){var r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);
  document.getElementById("th").textContent=tLabel[theme];}
document.getElementById("th").onclick=function(){theme=themes[(themes.indexOf(theme)+1)%3];try{localStorage.setItem("theme",theme);}catch(e){}applyTheme();};
applyTheme();

/* ---------- search ---------- */
function words(s){return s.toLowerCase().replace(/ё/g,"е").split(/\s+/).filter(Boolean);}
function matches(q){
  var w=words(q);if(!w.length)return [];
  return nodes.filter(function(n){if(n.type!=="item")return false;
    var h=(n.name+" "+pathOf(n)).toLowerCase().replace(/ё/g,"е");
    return w.every(function(x){return h.indexOf(x)>=0;});
  }).sort(function(a,b){
    var s=w[0],am=a.name.toLowerCase().indexOf(s)===0?0:1,bm=b.name.toLowerCase().indexOf(s)===0?0:1;
    return am-bm||a.name.localeCompare(b.name,"ru");});
}
function hideSug(){sug.style.display="none";actIdx=-1;}
function renderSug(){
  var q=qi.value.trim();clr.style.display=(q||focusId)?"block":"none";
  if(!q||focusId){hideSug();return;}
  sugList=matches(q);sug.textContent="";
  if(!sugList.length){var e=el("div","sg","Ничего не найдено");e.style.color="var(--mut)";e.style.cursor="default";sug.appendChild(e);sug.style.display="block";return;}
  sugList.slice(0,8).forEach(function(n,i){
    var d=el("div","sg"+(i===actIdx?" act":""));d.setAttribute("role","option");
    d.appendChild(el("b","",n.name));d.appendChild(el("small","","В наличии: "+n.qty+(pathOf(n)?" · "+pathOf(n):"")));
    d.addEventListener("pointerdown",function(ev){ev.preventDefault();pick(n.id);});
    sug.appendChild(d);});
  if(sugList.length>8){var m=el("div","sg","Показать все результаты: "+sugList.length);m.style.color="var(--acc)";
    m.addEventListener("pointerdown",function(ev){ev.preventDefault();showAll();});sug.appendChild(m);}
  sug.style.display="block";
}
function pick(id){focusId=id;showRes=false;qi.value=byId[id]?byId[id].name:"";hideSug();clr.style.display="block";qi.blur();render();window.scrollTo(0,0);}
function showAll(){focusId=null;showRes=true;hideSug();render();}
function resetSearch(){focusId=null;showRes=false;qi.value="";hideSug();clr.style.display="none";render();}
qi.addEventListener("input",function(){focusId=null;showRes=false;actIdx=-1;renderSug();render();});
qi.addEventListener("focus",function(){if(focusId){qi.select();}renderSug();});
qi.addEventListener("blur",function(){setTimeout(hideSug,120);});
qi.addEventListener("keydown",function(e){
  var n=Math.min(sugList.length,8);
  if(e.key==="ArrowDown"&&n){e.preventDefault();actIdx=(actIdx+1)%n;renderSug();}
  else if(e.key==="ArrowUp"&&n){e.preventDefault();actIdx=(actIdx<=0?n:actIdx)-1;renderSug();}
  else if(e.key==="Enter"){e.preventDefault();var q=qi.value.trim();if(!q)return;
    if(actIdx>=0&&sugList[actIdx])pick(sugList[actIdx].id);
    else if(sugList.length===1)pick(sugList[0].id);
    else showAll();}
  else if(e.key==="Escape"){hideSug();}
});
clr.onclick=resetSearch;

/* ---------- render ---------- */
function render(){
  tree.textContent="";
  var tot=0,cnt=0;nodes.forEach(function(n){if(n.type==="item"){tot+=n.qty||0;cnt++;}});
  document.getElementById("total").textContent=cnt?("Позиций: "+cnt+" · Всего: "+tot):"";
  clr.style.display=(qi.value.trim()||focusId)?"block":"none";
  if(focusId&&!byId[focusId])focusId=null;
  if(focusId){
    var n=byId[focusId],w=el("div","single"),bar=el("div","bar");
    bar.appendChild(btn("← Ко всем товарам","",resetSearch));
    bar.appendChild(el("span","","Найден 1 товар"));
    tree.appendChild(bar);w.appendChild(drawItem(n,true));tree.appendChild(w);return;
  }
  var q=qi.value.trim();
  if(q&&showRes){
    var r=matches(q),bar2=el("div","bar");
    bar2.appendChild(btn("← Ко всем товарам","",resetSearch));
    bar2.appendChild(el("span","","Найдено: "+r.length+" · нажмите на название, чтобы открыть один товар"));
    tree.appendChild(bar2);
    if(!r.length)tree.appendChild(el("div","empty","Ничего не найдено"));
    r.forEach(function(n){tree.appendChild(drawItem(n,true));});return;
  }
  renderLevel();
}
function drawItem(n,withPath){
  var box=el("div","node item"),row=el("div","row"),nm=el("div","nm"),nmt=el("div","name",n.name);
  if(withPath){nmt.style.cursor="pointer";nmt.onclick=function(){pick(n.id);};}
  nm.appendChild(nmt);
  if(withPath&&pathOf(n))nm.appendChild(el("div","path",pathOf(n)));
  row.appendChild(nm);
  var q=el("div","qty");
  q.appendChild(btn("−","i",function(){setQty(n,(n.qty||0)-1);},"Уменьшить"));
  q.appendChild(el("b","",String(n.qty||0)));
  q.appendChild(btn("+","i",function(){setQty(n,(n.qty||0)+1);},"Увеличить"));
  row.appendChild(q);
  var a=el("div","acts");
  a.appendChild(btn("✎","i",function(){form("edit",n);},"Редактировать"));
  a.appendChild(btn("🗑","i d",function(){confirmDel(n);},"Удалить"));
  row.appendChild(a);box.appendChild(row);return box;
}
function goTo(id){curId=id||"";render();window.scrollTo(0,0);}
function crumbs(){
  var bar=el("div","crumbs"),chain=[],c=byId[curId],g=0;
  while(c&&g++<50){chain.unshift(c);c=byId[c.parentId];}
  var home=btn("🏠 Главная","",function(){goTo("");});bar.appendChild(home);
  chain.forEach(function(n,i){
    bar.appendChild(el("span","sep","›"));
    if(i===chain.length-1)bar.appendChild(el("b","cur",n.name));
    else bar.appendChild(btn(n.name,"",function(){goTo(n.id);}));
  });
  return bar;
}
function catCard(n){
  var box=el("div","node cat go"),row=el("div","row");
  row.onclick=function(){goTo(n.id);};
  var nm=el("div","nm");nm.appendChild(el("div","name","📁 "+n.name));
  var k=kids(n.id).length;nm.appendChild(el("div","path",k?("Вложено: "+k):"Пусто"));
  row.appendChild(nm);
  row.appendChild(el("span","badge","Всего: "+sum(n.id)));
  var a=el("div","acts");
  a.appendChild(btn("✎","i",function(e){e.stopPropagation();form("edit",n);},"Редактировать"));
  a.appendChild(btn("🗑","i d",function(e){e.stopPropagation();confirmDel(n);},"Удалить"));
  a.appendChild(el("span","chev","›"));
  row.appendChild(a);box.appendChild(row);return box;
}
function renderLevel(){
  var add=document.getElementById("addRoot");add.style.display=curId?"none":"";
  if(curId&&!byId[curId])curId="";
  if(curId)tree.appendChild(crumbs());
  var cur=curId?byId[curId]:null;
  if(cur){
    var head=el("div","node head"),row=el("div","row");
    row.appendChild(btn("← Назад","",function(){goTo(cur.parentId);}));
    var nm=el("div","nm");nm.appendChild(el("div","name",cur.name));row.appendChild(nm);
    row.appendChild(el("span","badge","Всего: "+sum(cur.id)));
    var a=el("div","acts");
    a.appendChild(btn("+ Подкатегория","",function(){form("cat",cur.id);}));
    a.appendChild(btn("+ Товар","p",function(){form("item",cur.id);}));
    a.appendChild(btn("✎","i",function(){form("edit",cur);},"Редактировать"));
    a.appendChild(btn("🗑","i d",function(){confirmDel(cur);},"Удалить"));
    row.appendChild(a);head.appendChild(row);tree.appendChild(head);
  }
  var list=kids(curId);
  if(!list.length){tree.appendChild(el("div","empty",!loaded?"Загрузка…":(cur?"Здесь пока ничего нет. Добавьте подкатегорию или товар.":"Пока пусто. Нажмите «+ Категория», чтобы начать.")));return;}
  list.forEach(function(n){tree.appendChild(n.type==="cat"?catCard(n):drawItem(n,false));});
}
function setQty(n,v){if(v<0)v=0;col.doc(n.id).update({qty:v}).catch(fail);}
function fail(e){msg.textContent="Не удалось сохранить: "+((e&&e.message)||"не удалось записать данные");}

/* ---------- dialogs ---------- */
function show(){ov.classList.add("on");}
function hide(){ov.classList.remove("on");dlg.textContent="";}
ov.addEventListener("pointerdown",function(e){if(e.target===ov)hide();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("on"))hide();});

function form(mode,arg){
  dlg.textContent="";
  var isEdit=mode==="edit",type=isEdit?arg.type:mode;
  dlg.appendChild(el("h2","",isEdit?"Редактировать":(type==="cat"?(arg?"Новая подкатегория":"Новая категория"):"Новый товар")));
  var i1=el("input");i1.type="text";i1.maxLength=120;i1.value=isEdit?arg.name:"";
  dlg.appendChild(el("label","","Название"));dlg.appendChild(i1);
  var i2=null;
  if(type==="item"){i2=el("input");i2.type="number";i2.inputMode="numeric";i2.min="0";i2.step="1";i2.value=isEdit?(arg.qty||0):1;dlg.appendChild(el("label","","Количество"));dlg.appendChild(i2);}
  var err=el("div");err.id="err";dlg.appendChild(err);
  var act=el("div","act");act.appendChild(btn("Отмена","",hide));
  var ok=btn("Сохранить","p",function(){
    var name=i1.value.trim();if(!name){err.textContent="Введите название";return;}
    var qty=i2?Math.max(0,Math.round(Number(i2.value)||0)):null;
    ok.disabled=true;var p;
    if(isEdit){var u={name:name};if(i2)u.qty=qty;p=col.doc(arg.id).update(u);}
    else{var d={type:type,parentId:(typeof arg==="string")?arg:"",name:name,createdAt:Date.now()};if(i2)d.qty=qty;p=col.add(d);
      if(typeof arg==="string")open[arg]=true;}
    p.then(hide).catch(function(e){ok.disabled=false;err.textContent="Ошибка: "+((e&&e.message)||"не удалось записать данные");});
  });
  act.appendChild(ok);dlg.appendChild(act);
  i1.addEventListener("keydown",function(e){if(e.key==="Enter")ok.click();});
  if(i2)i2.addEventListener("keydown",function(e){if(e.key==="Enter")ok.click();});
  show();setTimeout(function(){i1.focus();},30);
}
function confirmDel(n){
  var d=n.type==="cat"?allDesc(n.id):[];
  dlg.textContent="";
  dlg.appendChild(el("h2","","Удалить «"+n.name+"»?"));
  dlg.appendChild(el("div","note",d.length?("Вместе с ним будет удалено вложенных элементов: "+d.length+". Это нельзя отменить."):"Это нельзя отменить."));
  var err=el("div");err.id="err";dlg.appendChild(err);
  var act=el("div","act");act.appendChild(btn("Отмена","",hide));
  var ok=btn("Удалить","d",function(){
    ok.disabled=true;
    Promise.all(d.concat([n]).map(function(x){return col.doc(x.id).delete();})).then(function(){if(n.type==="cat"&&(curId===n.id||d.some(function(x){return x.id===curId;})))curId=n.parentId;hide();render();}).catch(function(e){ok.disabled=false;err.textContent="Ошибка: "+((e&&e.message)||"не удалось записать данные");});
  });
  ok.style.background="var(--danger)";ok.style.borderColor="var(--danger)";ok.style.color="#fff";
  act.appendChild(ok);dlg.appendChild(act);show();
}
document.getElementById("addRoot").onclick=function(){form("cat",null);};

/* ---------- локальная база данных ---------- */
/* Данные хранятся в localStorage этого браузера, без внешнего сервера. */
var STORAGE_KEY = "warehouse_inventory_db_v1";

function readStoredNodes(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e) {
    msg.textContent = "Не удалось прочитать локальную базу данных: " + (e.message || e);
    return [];
  }
}
function saveStoredNodes(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
    msg.textContent = "Сохранено в этом браузере";
    return true;
  } catch(e) {
    fail(e);
    return false;
  }
}
function makeId(){
  return "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10);
}
function emitSnapshot(){
  var docs = nodes.map(function(n){
    return { id:n.id, data:function(){ return {
      type:n.type, parentId:n.parentId, name:n.name, qty:n.qty, createdAt:n.createdAt
    }; }};
  });
  if (col && col._listener) col._listener({docs:docs});
}
function persistAndEmit(){
  if (saveStoredNodes()) emitSnapshot();
}
function localCollection(){
  return {
    _listener:null,
    onSnapshot:function(success,error){
      this._listener = success;
      try { emitSnapshot(); } catch(e) { if(error) error(e); }
    },
    doc:function(id){
      return {
        update:function(values){
          return new Promise(function(resolve,reject){
            var n = nodes.find(function(x){ return x.id===id; });
            if(!n){ reject(new Error("Запись не найдена")); return; }
            Object.keys(values).forEach(function(k){ n[k]=values[k]; });
            if(saveStoredNodes()){ emitSnapshot(); resolve(); }
            else reject(new Error("Не удалось сохранить данные"));
          });
        },
        delete:function(){
          return new Promise(function(resolve,reject){
            var before = nodes.length;
            nodes = nodes.filter(function(x){ return x.id!==id; });
            if(nodes.length===before){ resolve(); return; }
            if(saveStoredNodes()){ emitSnapshot(); resolve(); }
            else reject(new Error("Не удалось сохранить данные"));
          });
        }
      };
    },
    add:function(data){
      return new Promise(function(resolve,reject){
        var item = Object.assign({}, data, {id:makeId()});
        nodes.push(item);
        if(saveStoredNodes()){ emitSnapshot(); resolve({id:item.id}); }
        else {
          nodes = nodes.filter(function(x){ return x.id!==item.id; });
          reject(new Error("Не удалось сохранить данные"));
        }
      });
    }
  };
}

render();
try {
  col = localCollection();
  col.onSnapshot(function(snap){
    loaded = true;
    if(msg.textContent === "Сохранено в этом браузере") {
      /* Короткое подтверждение не мешает работе интерфейса. */
    } else {
      msg.textContent = "Локальная база данных · данные сохраняются в этом браузере";
    }
    nodes = snap.docs.map(function(d){
      var x=d.data()||{};
      return {id:d.id,type:x.type==="item"?"item":"cat",parentId:x.parentId||"",
        name:String(x.name||"Без названия"),qty:Number(x.qty)||0,createdAt:x.createdAt||0};
    });
    byId={}; nodes.forEach(function(n){byId[n.id]=n;});
    render();
    if(document.activeElement===qi) renderSug();
  },function(e){msg.textContent="Ошибка локальной базы данных: "+((e&&e.message)||e);});
  window.addEventListener("storage",function(e){
    if(e.key===STORAGE_KEY){
      nodes=readStoredNodes();
      byId={};nodes.forEach(function(n){byId[n.id]=n;});
      loaded=true;render();
    }
  });
} catch(e) {
  loaded=true;
  msg.textContent="Не удалось запустить локальную базу данных: "+(e.message||e);
}
</script>
